apply plugin: 'groovy'
apply plugin: 'maven-publish'
apply plugin: 'java-gradle-plugin'

group = 'top.niunaijun.blackobfuscator'
version = '2.0.0'

gradlePlugin {
    plugins {
        blackobfuscator {
            id = 'top.niunaijun.blackobfuscator'
            implementationClass = 'top.niunaijun.blackobfuscator.ObfPlugin'
        }
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

dependencies {
    // AGP 仅编译期引用（运行时由宿主工程提供，避免版本冲突）
    compileOnly 'com.android.tools.build:gradle:7.4.2'
    // 核心混淆引擎（Gradle 7.6 现代化改造版，D8 替代 dx，mavenLocal 发布）
    implementation 'com.github.4327b9fb.BlackObfuscator:dex-tools:2.3'
    implementation 'commons-io:commons-io:2.5'
    implementation gradleApi()
    implementation localGroovy()
}

java {
    // AGP 7.4 起为 Java 11 字节码，compileOnly 依赖要求 >= 11
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
